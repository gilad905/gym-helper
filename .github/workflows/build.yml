name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :core:test :app:assembleRelease --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk gym-helper.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gym-helper.apk \
            --title "Gym Helper (latest build)" \
            --notes "Build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. On your phone, download gym-helper.apk below and open it to install or update." \
            --latest
